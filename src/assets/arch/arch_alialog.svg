<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="100%">
  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141210" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#231f1c" />
      <stop offset="100%" stop-color="#181512" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a8a29e" />
    </marker>
  </defs>

  
  <style>
    .title { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #f59e0b; letter-spacing: 0.08em; text-transform: uppercase; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 10px; fill: #a8a29e; }
    .node-title { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 700; fill: #fafaf9; }
    .node-tech { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 500; fill: #f59e0b; }
    .node-desc { font-family: 'Inter', sans-serif; font-size: 9.5px; fill: #a8a29e; }
    .flow-label { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; fill: #d6d3d1; background: #0c0a09; }
    .group-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600; fill: #948f8a; text-transform: uppercase; letter-spacing: 0.06em; }
  </style>

  <rect width="760" height="400" rx="12" fill="url(#bgGrad)" stroke="#292524" stroke-width="1.5"/>
  <rect width="760" height="400" rx="12" fill="url(#grid)" />

  <text x="24" y="28" class="title">// FLUJO DE INFORMACION 360: ECOSISTEMA ALIALOG + ASISTENTE ALIA</text>
  <text x="580" y="28" class="node-tech">CLEAN ARCHITECTURE · ACID</text>
  <line x1="24" y1="38" x2="736" y2="38" stroke="#292524" stroke-width="1" />

  <!-- Column 1: 4 Actors / Channels -->
  <rect x="20" y="54" width="180" height="74" rx="6" fill="url(#cardGrad)" stroke="#3f3a36" />
  <text x="32" y="74" class="node-title">1. Clientes Finales</text>
  <text x="32" y="90" class="node-tech">WhatsApp Cloud API</text>
  <text x="32" y="106" class="node-desc">Pedidos en lenguaje natural</text>

  <rect x="20" y="138" width="180" height="74" rx="6" fill="url(#cardGrad)" stroke="#3f3a36" />
  <text x="32" y="158" class="node-title">2. Dueño / Gerencia</text>
  <text x="32" y="174" class="node-tech">WhatsApp Cloud API</text>
  <text x="32" y="190" class="node-desc">Consultas de KPIs y rutas</text>

  <rect x="20" y="222" width="180" height="74" rx="6" fill="url(#cardGrad)" stroke="#3f3a36" />
  <text x="32" y="242" class="node-title">3. Operadores Almacen</text>
  <text x="32" y="258" class="node-tech">React SPA + TailwindCSS</text>
  <text x="32" y="274" class="node-desc">Consolidacion y despacho</text>

  <rect x="20" y="306" width="180" height="74" rx="6" fill="url(#cardGrad)" stroke="#3f3a36" />
  <text x="32" y="326" class="node-title">4. Choferes en Calle</text>
  <text x="32" y="342" class="node-tech">Flutter App (Offline-First)</text>
  <text x="32" y="358" class="node-desc">Entregas con sync diferido</text>

  <!-- Column 2: Alia Conversational Module & API Gateway -->
  <rect x="245" y="64" width="165" height="135" rx="8" fill="url(#amberBox)" stroke="#f59e0b" />
  <text x="257" y="86" class="title">ASISTENTE "ALIA"</text>
  <text x="257" y="104" class="node-title">Motor Conversacional</text>
  <text x="257" y="122" class="node-desc">• NLP Parser de Pedidos</text>
  <text x="257" y="138" class="node-desc">• Validador de Stock</text>
  <text x="257" y="154" class="node-desc">• Reporteria Ejecutiva</text>
  <text x="257" y="176" class="node-tech">Webhooks HTTPS</text>

  <rect x="245" y="225" width="165" height="145" rx="8" fill="#181512" stroke="#3f3a36" />
  <text x="257" y="248" class="node-title">API Gateway &amp; Sync</text>
  <text x="257" y="264" class="node-tech">NestJS Guards + JWT</text>
  <text x="257" y="286" class="node-desc">• Control de Roles</text>
  <text x="257" y="302" class="node-desc">• Resolucion Conflictos</text>
  <text x="257" y="318" class="node-desc">• Cola de Sincronizacion</text>
  <text x="257" y="342" class="node-tech">REST / JSON DTOs</text>

  <!-- Arrows Col 1 -> Col 2 -->
  <line x1="200" y1="91" x2="243" y2="110" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="200" y1="175" x2="243" y2="150" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="200" y1="259" x2="243" y2="270" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="200" y1="343" x2="243" y2="325" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Column 3: NestJS Clean Architecture Core & PostgreSQL -->
  <rect x="455" y="58" width="280" height="195" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.6" />
  <text x="470" y="80" class="title">NUCLEO BACKEND (NESTJS)</text>
  <text x="470" y="96" class="node-desc">Capa de Aplicacion &amp; Casos de Uso</text>

  <rect x="470" y="108" width="120" height="58" rx="5" fill="#141210" stroke="#292524" />
  <text x="480" y="128" class="node-title">OrderService</text>
  <text x="480" y="144" class="node-tech">Cola Despacho</text>

  <rect x="600" y="108" width="120" height="58" rx="5" fill="#141210" stroke="#292524" />
  <text x="610" y="128" class="node-title">DispatchService</text>
  <text x="610" y="144" class="node-tech">Rutas &amp; Camiones</text>

  <rect x="470" y="178" width="120" height="58" rx="5" fill="#141210" stroke="#292524" />
  <text x="480" y="198" class="node-title">InventoryService</text>
  <text x="480" y="214" class="node-tech">Reserva Stock</text>

  <rect x="600" y="178" width="120" height="58" rx="5" fill="#141210" stroke="#292524" />
  <text x="610" y="198" class="node-title">SyncService</text>
  <text x="610" y="214" class="node-tech">Batch Offline</text>

  <!-- Database Box -->
  <rect x="455" y="275" width="280" height="100" rx="8" fill="url(#amberBox)" stroke="#f59e0b" />
  <text x="470" y="298" class="node-title">PostgreSQL / Supabase + Docker</text>
  <text x="470" y="316" class="node-tech">Transacciones ACID · Row-Level Security</text>
  <text x="470" y="336" class="node-desc">Descuento atomico de inventario entre almacen</text>
  <text x="470" y="352" class="node-desc">y camiones con trazabilidad completa de estados.</text>

  <!-- Arrows Col 2 -> Col 3 -->
  <line x1="410" y1="130" x2="453" y2="135" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="410" y1="295" x2="453" y2="210" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="595" y1="253" x2="595" y2="273" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" />
</svg>