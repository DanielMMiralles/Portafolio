<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="100%">
  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141210" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#231f1c" />
      <stop offset="100%" stop-color="#181512" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a8a29e" />
    </marker>
  </defs>

  
  <style>
    .title { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #f59e0b; letter-spacing: 0.08em; text-transform: uppercase; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 10px; fill: #a8a29e; }
    .node-title { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 700; fill: #fafaf9; }
    .node-tech { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 500; fill: #f59e0b; }
    .node-desc { font-family: 'Inter', sans-serif; font-size: 9.5px; fill: #a8a29e; }
    .flow-label { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; fill: #d6d3d1; background: #0c0a09; }
    .group-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600; fill: #948f8a; text-transform: uppercase; letter-spacing: 0.06em; }
  </style>

  <rect width="760" height="400" rx="12" fill="url(#bgGrad)" stroke="#292524" stroke-width="1.5"/>
  <rect width="760" height="400" rx="12" fill="url(#grid)" />

  <text x="24" y="28" class="title">// ARQUITECTURA DE CONCURRENCIA: MIDDLEWARE DE PAGOS &amp; IDEMPOTENCIA</text>
  <text x="570" y="28" class="node-tech">NESTJS · REDIS REDLOCK · AES-256</text>
  <line x1="24" y1="38" x2="736" y2="38" stroke="#292524" stroke-width="1" />

  <!-- Step 1: Inbound Request -->
  <rect x="24" y="130" width="145" height="130" rx="8" fill="url(#cardGrad)" stroke="#3f3a36" />
  <text x="36" y="156" class="node-title">1. Trafico Entrante</text>
  <text x="36" y="174" class="node-tech">Clientes &amp; Webhooks</text>
  <text x="36" y="196" class="node-desc">Rafagas concurrentes</text>
  <text x="36" y="212" class="node-desc">y reintentos de red</text>
  <text x="36" y="234" class="node-tech">Idempotency-Key</text>

  <line x1="169" y1="195" x2="205" y2="195" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Step 2: Edge Security & Redlock -->
  <rect x="207" y="70" width="235" height="250" rx="10" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="1.5" />
  <text x="223" y="95" class="title">2. CAPA DE CONTROL &amp; LOCKS</text>

  <rect x="223" y="110" width="203" height="60" rx="6" fill="#161412" stroke="#3f3a36" />
  <text x="235" y="130" class="node-title">Verificador Criptografico</text>
  <text x="235" y="146" class="node-tech">Firma HMAC-SHA256 + DTO</text>
  <text x="235" y="160" class="node-desc">Descarta payloads alterados</text>

  <rect x="223" y="182" width="203" height="65" rx="6" fill="#161412" stroke="#f59e0b" />
  <text x="235" y="202" class="node-title">Redis Distributed Lock</text>
  <text x="235" y="218" class="node-tech">Patron Redlock (Mutex Atomico)</text>
  <text x="235" y="234" class="node-desc">Bloquea duplicados en &lt;5ms</text>

  <rect x="223" y="259" width="203" height="48" rx="6" fill="#161412" stroke="#3f3a36" />
  <text x="235" y="279" class="node-title">Circuit Breaker</text>
  <text x="235" y="295" class="node-tech">Backoff Exponencial</text>

  <!-- Step 3: Gateways & Vault -->
  <rect x="490" y="75" width="245" height="110" rx="8" fill="url(#cardGrad)" stroke="#3f3a36" />
  <text x="506" y="100" class="node-title">3. Pasarelas Bancarias Externas</text>
  <text x="506" y="118" class="node-tech">Ejecucion Unica Garantizada</text>
  <text x="506" y="138" class="node-desc">Comunicacion TLS mutua con</text>
  <text x="506" y="154" class="node-desc">procesadores de pago y bancos.</text>

  <rect x="490" y="210" width="245" height="110" rx="8" fill="url(#cardGrad)" stroke="#3f3a36" />
  <text x="506" y="235" class="node-title">4. Boveda &amp; Libro Mayor ACID</text>
  <text x="506" y="253" class="node-tech">PostgreSQL + Cifrado AES-256-GCM</text>
  <text x="506" y="273" class="node-desc">Registro inmutable de estados y</text>
  <text x="506" y="289" class="node-desc">trazas de auditoria financiera.</text>

  <line x1="442" y1="150" x2="488" y2="135" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="442" y1="245" x2="488" y2="260" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" />
</svg>